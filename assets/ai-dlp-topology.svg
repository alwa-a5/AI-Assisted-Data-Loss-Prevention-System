<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI-Assisted Data Loss Prevention System topology</title>
  <desc id="desc">A user submits a prompt or supported file to a Streamlit dashboard on an Ubuntu virtual machine. Presidio and custom secret detection inspect the content, Ollama with Llama 3.2 classifies it, and a deterministic risk and policy engine returns Allow, Warn, or Block. Results are redacted and written to results.json for monitoring and evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15253d"/>
      <stop offset="1" stop-color="#101b30"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#45b7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#36d399"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 17px Inter, Segoe UI, Arial, sans-serif; fill: #a8bad3; }
      .node-title { font: 700 23px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .node-copy { font: 500 16px Inter, Segoe UI, Arial, sans-serif; fill: #b9c8dd; }
      .small { font: 600 14px Inter, Segoe UI, Arial, sans-serif; fill: #d9e5f4; letter-spacing: .4px; }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #07111f; }
      .outline { stroke: #2d4667; stroke-width: 2; }
      .flow { fill: none; stroke: #45b7ff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .record { fill: none; stroke: #36d399; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>

  <text x="70" y="66" class="title">AI-Assisted Data Loss Prevention System</text>
  <text x="70" y="96" class="subtitle">Local inspection, AI-assisted classification, deterministic enforcement</text>

  <!-- Ubuntu VM boundary -->
  <rect x="300" y="128" width="1230" height="710" rx="30" fill="#0b1628" stroke="#334d70" stroke-width="3" stroke-dasharray="12 10"/>
  <circle cx="345" cy="170" r="17" fill="none" stroke="#e95420" stroke-width="7"/>
  <circle cx="345" cy="147" r="5" fill="#e95420"/>
  <circle cx="325" cy="181" r="5" fill="#e95420"/>
  <circle cx="365" cy="181" r="5" fill="#e95420"/>
  <text x="380" y="178" class="node-title">Local Ubuntu VM</text>
  <text x="1220" y="177" class="subtitle">Sensitive content remains local</text>

  <!-- User input -->
  <g filter="url(#shadow)">
    <rect x="50" y="305" width="215" height="210" rx="24" fill="url(#panel)" class="outline"/>
    <circle cx="157" cy="355" r="30" fill="#203a5d" stroke="#67c4ff" stroke-width="3"/>
    <circle cx="157" cy="346" r="10" fill="#67c4ff"/>
    <path d="M132 379c6-18 44-18 50 0" fill="none" stroke="#67c4ff" stroke-width="7" stroke-linecap="round"/>
    <text x="157" y="414" text-anchor="middle" class="node-title">User Input</text>
    <text x="157" y="445" text-anchor="middle" class="node-copy">Text prompt or file</text>
    <text x="157" y="471" text-anchor="middle" class="node-copy">.txt  .csv  .docx</text>
  </g>

  <!-- Streamlit -->
  <g filter="url(#shadow)">
    <rect x="350" y="305" width="235" height="210" rx="24" fill="url(#panel)" class="outline"/>
    <path d="M425 365c23 13 53 13 78 0l-13 20c-18 12-36 12-53 0z" fill="#ff4b4b"/>
    <path d="M439 350l27-31 25 31" fill="none" stroke="#ff4b4b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="467" y="414" text-anchor="middle" class="node-title">Streamlit</text>
    <text x="467" y="445" text-anchor="middle" class="node-copy">Scanner interface</text>
    <text x="467" y="471" text-anchor="middle" class="node-copy">Destination selection</text>
  </g>

  <!-- Presidio -->
  <g filter="url(#shadow)">
    <rect x="655" y="236" width="260" height="220" rx="24" fill="url(#panel)" class="outline"/>
    <path d="M785 270l39 16v31c0 31-20 52-39 62-19-10-39-31-39-62v-31z" fill="#2b69d1" opacity=".9"/>
    <path d="M768 321l13 13 24-29" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="785" y="399" text-anchor="middle" class="node-title">Sensitive Data</text>
    <text x="785" y="427" text-anchor="middle" class="node-copy">Presidio PII + secret detection</text>
  </g>

  <!-- Ollama -->
  <g filter="url(#shadow)">
    <rect x="655" y="525" width="260" height="220" rx="24" fill="url(#panel)" class="outline"/>
    <circle cx="785" cy="581" r="34" fill="#101010" stroke="#9faac0" stroke-width="3"/>
    <circle cx="773" cy="578" r="4" fill="#ffffff"/>
    <circle cx="797" cy="578" r="4" fill="#ffffff"/>
    <path d="M772 594c9 6 18 6 27 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="785" y="647" text-anchor="middle" class="node-title">Local Llama 3.2</text>
    <text x="785" y="676" text-anchor="middle" class="node-copy">Ollama classification</text>
    <text x="785" y="702" text-anchor="middle" class="node-copy">Confidence, reason, recommendation</text>
  </g>

  <!-- Policy engine -->
  <g filter="url(#shadow)">
    <rect x="1000" y="305" width="275" height="250" rx="24" fill="url(#panel)" class="outline"/>
    <circle cx="1137" cy="365" r="34" fill="#6f55d9"/>
    <path d="M1118 365h38M1137 346v38" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <text x="1137" y="431" text-anchor="middle" class="node-title">Risk &amp; Policy Engine</text>
    <text x="1137" y="462" text-anchor="middle" class="node-copy">Deterministic guardrails</text>
    <text x="1137" y="488" text-anchor="middle" class="node-copy">DLP-001 through DLP-006</text>
    <text x="1137" y="519" text-anchor="middle" class="small">FINAL ENFORCEMENT DECISION</text>
  </g>

  <!-- Decision output -->
  <g filter="url(#shadow)">
    <rect x="1335" y="285" width="160" height="290" rx="24" fill="url(#panel)" class="outline"/>
    <text x="1415" y="327" text-anchor="middle" class="node-title">Decision</text>
    <rect x="1362" y="352" width="106" height="42" rx="21" fill="#36d399"/>
    <text x="1415" y="379" text-anchor="middle" class="label">ALLOW</text>
    <rect x="1362" y="414" width="106" height="42" rx="21" fill="#fbbf24"/>
    <text x="1415" y="441" text-anchor="middle" class="label">WARN</text>
    <rect x="1362" y="476" width="106" height="42" rx="21" fill="#fb5b5b"/>
    <text x="1415" y="503" text-anchor="middle" class="label">BLOCK</text>
    <text x="1415" y="548" text-anchor="middle" class="node-copy">+ redaction</text>
  </g>

  <!-- Results and dashboard views -->
  <g filter="url(#shadow)">
    <rect x="1000" y="640" width="220" height="135" rx="22" fill="url(#panel)" class="outline"/>
    <path d="M1040 674h46v57h-46z" fill="none" stroke="#36d399" stroke-width="4"/>
    <path d="M1048 687h30M1048 700h30M1048 713h22" stroke="#36d399" stroke-width="3" stroke-linecap="round"/>
    <text x="1125" y="698" class="node-title">results.json</text>
    <text x="1125" y="726" class="node-copy">Scan history</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1300" y="640" width="195" height="135" rx="22" fill="url(#panel)" class="outline"/>
    <path d="M1334 726v-42M1352 726v-24M1370 726v-58" stroke="#45b7ff" stroke-width="8" stroke-linecap="round"/>
    <text x="1396" y="693" class="node-title">Dashboard</text>
    <text x="1396" y="721" class="node-copy">Monitoring</text>
    <text x="1396" y="747" class="node-copy">Evaluation</text>
  </g>

  <!-- Flow arrows -->
  <path d="M265 410H340" class="flow"/>
  <path d="M585 410H625Q635 410 635 390V346Q635 346 645 346" class="flow"/>
  <path d="M785 456V515" class="flow"/>
  <path d="M915 635H950Q970 635 970 615V470Q970 430 990 430" class="flow"/>
  <path d="M1275 430H1325" class="flow"/>
  <path d="M1137 555V630" class="record"/>
  <path d="M1220 707H1290" class="record"/>

  <!-- Arrow labels -->
  <rect x="270" y="375" width="66" height="26" rx="13" fill="#45b7ff"/>
  <text x="303" y="393" text-anchor="middle" class="label">SUBMIT</text>
  <rect x="927" y="571" width="95" height="26" rx="13" fill="#45b7ff"/>
  <text x="974" y="589" text-anchor="middle" class="label">CLASSIFY</text>
  <rect x="1238" y="395" width="83" height="26" rx="13" fill="#45b7ff"/>
  <text x="1279" y="413" text-anchor="middle" class="label">ENFORCE</text>
  <rect x="1150" y="586" width="70" height="26" rx="13" fill="#36d399"/>
  <text x="1185" y="604" text-anchor="middle" class="label">RECORD</text>
</svg>
