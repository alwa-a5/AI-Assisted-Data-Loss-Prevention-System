<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI-Assisted Data Loss Prevention System topology</title>
  <desc id="desc">A Draw.io topology showing separate Presidio detection and Ollama classification paths feeding a deterministic Python DLP policy engine on a local Ubuntu virtual machine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#101c33"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#192a44"/><stop offset="1" stop-color="#111d32"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#45b7ff"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#36d399"/></marker>
    <style>
      .title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.subtitle{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#a8bad3}.heading{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.copy{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#b9c8dd}.small{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#dce7f6;letter-spacing:.4px}.blue{fill:none;stroke:#45b7ff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#blueArrow)}.green{fill:none;stroke:#36d399;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#greenArrow)}.card{fill:url(#card);stroke:#3d5d83;stroke-width:2}.tag{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#07111f}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" class="title">AI-Assisted Data Loss Prevention System</text>
  <text x="60" y="94" class="subtitle">Local inspection • AI-assisted classification • deterministic enforcement</text>
  <rect x="280" y="120" width="1250" height="710" rx="30" fill="#0b1628" stroke="#38577d" stroke-width="3" stroke-dasharray="12 10"/>
  <image href="data:image/svg+xml;base64," x="312" y="142" width="45" height="45"/>
  <text x="375" y="174" class="heading">Local Ubuntu VM</text>
  <text x="1470" y="174" text-anchor="end" class="subtitle">Sensitive content remains local</text>
  <g filter="url(#shadow)"><rect x="45" y="330" width="205" height="190" rx="22" class="card"/><path d="M112 350h61l22 22v58h-83z" fill="#eaf5ff" stroke="#45b7ff" stroke-width="3"/><path d="M173 350v23h22" fill="none" stroke="#45b7ff" stroke-width="3"/><text x="153" y="397" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#245176">FILE</text><text x="147" y="463" text-anchor="middle" class="heading">User Input</text><text x="147" y="491" text-anchor="middle" class="copy">Prompt or .txt/.csv/.docx</text></g>
  <g filter="url(#shadow)"><rect x="340" y="330" width="235" height="190" rx="22" class="card"/><image href="data:image/svg+xml;base64," x="420" y="350" width="75" height="70"/><text x="457" y="454" text-anchor="middle" class="heading">Streamlit Scanner</text><text x="457" y="481" text-anchor="middle" class="copy">Prompt/file + AI destination</text><text x="457" y="505" text-anchor="middle" class="copy">Approved or public</text></g>
  <g filter="url(#shadow)"><rect x="655" y="215" width="260" height="190" rx="22" class="card"/><path d="M785 237l40 16v32c0 32-20 54-40 64-20-10-40-32-40-64v-32z" fill="#2b69d1" stroke="#7db4ff" stroke-width="3"/><text x="785" y="294" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">PII</text><text x="785" y="361" text-anchor="middle" class="heading">Presidio Analyzer</text><text x="785" y="388" text-anchor="middle" class="copy">PII + API-key/secret detection</text></g>
  <g filter="url(#shadow)"><rect x="655" y="520" width="260" height="195" rx="22" class="card"/><image href="data:image/svg+xml;base64," x="750" y="538" width="70" height="78"/><text x="785" y="653" text-anchor="middle" class="heading">Ollama • Llama 3.2</text><text x="785" y="680" text-anchor="middle" class="copy">Classification • confidence • reason</text><text x="785" y="703" text-anchor="middle" class="copy">Recommended action</text></g>
  <g filter="url(#shadow)"><rect x="995" y="335" width="300" height="220" rx="22" fill="url(#card)" stroke="#6d5ce7" stroke-width="3"/><image href="data:image/svg+xml;base64," x="1107" y="355" width="72" height="72"/><text x="1142" y="468" text-anchor="middle" class="heading">Python Policy Engine</text><text x="1142" y="496" text-anchor="middle" class="copy">Risk scoring + deterministic guardrails</text><text x="1142" y="521" text-anchor="middle" class="copy">DLP-001 through DLP-006</text></g>
  <g filter="url(#shadow)"><rect x="1340" y="300" width="155" height="290" rx="22" class="card"/><text x="1417" y="342" text-anchor="middle" class="heading">Decision</text><rect x="1365" y="370" width="105" height="42" rx="21" fill="#36d399"/><text x="1417" y="397" text-anchor="middle" class="tag">ALLOW</text><rect x="1365" y="432" width="105" height="42" rx="21" fill="#fbbf24"/><text x="1417" y="459" text-anchor="middle" class="tag">WARN</text><rect x="1365" y="494" width="105" height="42" rx="21" fill="#fb5b5b"/><text x="1417" y="521" text-anchor="middle" class="tag">BLOCK</text><text x="1417" y="565" text-anchor="middle" class="copy">+ redacted copy</text></g>
  <g filter="url(#shadow)"><ellipse cx="1120" cy="666" rx="105" ry="18" fill="#17354a" stroke="#36d399" stroke-width="3"/><path d="M1015 666v82c0 10 47 18 105 18s105-8 105-18v-82" fill="#17354a" stroke="#36d399" stroke-width="3"/><ellipse cx="1120" cy="748" rx="105" ry="18" fill="#17354a" stroke="#36d399" stroke-width="3"/><text x="1120" y="707" text-anchor="middle" class="heading">results.json</text><text x="1120" y="733" text-anchor="middle" class="copy">Persistent scan history</text></g>
  <g filter="url(#shadow)"><rect x="1290" y="650" width="220" height="130" rx="22" class="card"/><image href="data:image/svg+xml;base64," x="1369" y="662" width="62" height="55"/><text x="1400" y="742" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Monitor + Evaluate</text><text x="1400" y="765" text-anchor="middle" class="copy">History and test cases</text></g>
  <path d="M250 425h80" class="blue"/><path d="M575 405h38c17 0 22-8 22-25v-70c0-18 7-25 20-25" class="blue"/><path d="M575 455h38c17 0 22 8 22 25v112c0 18 7 25 20 25" class="blue"/><path d="M915 310h45c22 0 25 15 25 37v65c0 18 5 28 20 28" class="blue"/><path d="M915 617h45c22 0 25-15 25-37v-92c0-24 5-40 20-40" class="blue"/><path d="M1295 445h35" class="blue"/><path d="M1142 555v82" class="green"/><path d="M1225 710h65" class="green"/>
  <g><rect x="260" y="388" width="70" height="26" rx="13" fill="#45b7ff"/><text x="295" y="406" text-anchor="middle" class="tag">SUBMIT</text></g><g><rect x="596" y="267" width="68" height="26" rx="13" fill="#45b7ff"/><text x="630" y="285" text-anchor="middle" class="tag">DETECT</text></g><g><rect x="586" y="601" width="78" height="26" rx="13" fill="#45b7ff"/><text x="625" y="619" text-anchor="middle" class="tag">CLASSIFY</text></g><g><rect x="1252" y="408" width="82" height="26" rx="13" fill="#45b7ff"/><text x="1293" y="426" text-anchor="middle" class="tag">ENFORCE</text></g><g><rect x="1155" y="594" width="72" height="26" rx="13" fill="#36d399"/><text x="1191" y="612" text-anchor="middle" class="tag">RECORD</text></g><g><rect x="1235" y="672" width="65" height="26" rx="13" fill="#36d399"/><text x="1267" y="690" text-anchor="middle" class="tag">REVIEW</text></g>
  <text x="1518" y="861" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#6f87a8">Web-sourced brand marks: Simple Icons • Editable source: Draw.io</text>
</svg>
