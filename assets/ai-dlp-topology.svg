<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">AI-Assisted Data Loss Prevention System topology</title>
  <desc id="desc">A simple white-background topology showing user input moving through Streamlit, Presidio and Ollama analysis, a Python policy engine, and an allow, warn, or block decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#222"/></marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#111}.section{font:700 22px Arial,sans-serif;fill:#111}.label{font:700 19px Arial,sans-serif;fill:#111}.copy{font:500 15px Arial,sans-serif;fill:#333}.small{font:700 14px Arial,sans-serif;fill:#111}.box{fill:#fff;stroke:#222;stroke-width:2}.arrow{fill:none;stroke:#222;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="600" fill="#fff"/>
  <text x="700" y="48" text-anchor="middle" class="title">AI-Assisted Data Loss Prevention System</text>

  <rect x="225" y="82" width="1130" height="450" rx="18" fill="#fff" stroke="#777" stroke-width="2" stroke-dasharray="9 7"/>
  <image href="data:image/svg+xml;base64," x="255" y="100" width="48" height="48"/>
  <text x="320" y="134" class="section">Ubuntu Virtual Machine</text>

  <g>
    <rect x="30" y="220" width="165" height="160" rx="12" class="box"/>
    <path d="M85 242h50l20 20v55H85Z" fill="#fff" stroke="#222" stroke-width="3"/>
    <path d="M135 242v21h20" fill="none" stroke="#222" stroke-width="3"/>
    <text x="112" y="340" text-anchor="middle" class="label">User Input</text>
    <text x="112" y="365" text-anchor="middle" class="copy">Prompt or file</text>
  </g>

  <g>
    <rect x="285" y="195" width="200" height="210" rx="12" class="box"/>
    <image href="data:image/svg+xml;base64," x="345" y="220" width="80" height="75"/>
    <text x="385" y="330" text-anchor="middle" class="label">Streamlit</text>
    <text x="385" y="355" text-anchor="middle" class="copy">Scanner dashboard</text>
    <text x="385" y="378" text-anchor="middle" class="copy">Text or file upload</text>
  </g>

  <g>
    <rect x="545" y="170" width="280" height="260" rx="12" class="box"/>
    <path d="M630 198l36 14v28c0 29-18 48-36 58-18-10-36-29-36-58v-28Z" fill="#2b69d1"/>
    <text x="630" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#fff">PII</text>
    <image href="data:image/svg+xml;base64," x="705" y="198" width="62" height="70"/>
    <text x="685" y="326" text-anchor="middle" class="label">Presidio + Ollama</text>
    <text x="685" y="352" text-anchor="middle" class="copy">Detect sensitive data</text>
    <text x="685" y="375" text-anchor="middle" class="copy">Classify the content</text>
    <text x="685" y="401" text-anchor="middle" class="small">LOCAL ANALYSIS</text>
  </g>

  <g>
    <rect x="885" y="195" width="210" height="210" rx="12" class="box"/>
    <image href="data:image/svg+xml;base64," x="955" y="220" width="70" height="70"/>
    <text x="990" y="330" text-anchor="middle" class="label">Policy Engine</text>
    <text x="990" y="355" text-anchor="middle" class="copy">Risk score</text>
    <text x="990" y="378" text-anchor="middle" class="copy">DLP rules</text>
  </g>

  <g>
    <rect x="1155" y="180" width="165" height="240" rx="12" class="box"/>
    <text x="1238" y="220" text-anchor="middle" class="label">Decision</text>
    <rect x="1185" y="245" width="105" height="38" rx="8" fill="#b7e4c7" stroke="#2d6a4f"/>
    <text x="1238" y="270" text-anchor="middle" class="small">ALLOW</text>
    <rect x="1185" y="300" width="105" height="38" rx="8" fill="#ffe8a1" stroke="#b7791f"/>
    <text x="1238" y="325" text-anchor="middle" class="small">WARN</text>
    <rect x="1185" y="355" width="105" height="38" rx="8" fill="#ffc9c9" stroke="#c92a2a"/>
    <text x="1238" y="380" text-anchor="middle" class="small">BLOCK</text>
  </g>

  <path d="M195 300H275" class="arrow"/>
  <path d="M485 300H535" class="arrow"/>
  <path d="M825 300H875" class="arrow"/>
  <path d="M1095 300H1145" class="arrow"/>

  <text x="700" y="570" text-anchor="middle" class="copy">All scanning, classification, and enforcement run locally on Ubuntu.</text>
</svg>
